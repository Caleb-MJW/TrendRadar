name: Analyze Inspiration

on:
  schedule:
    - cron: "30 0,4,10,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendaradar-data
  cancel-in-progress: false

jobs:
  analyze-inspiration:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Analyze inspirations
        run: |
          python scripts/merge_clusters.py
          python scripts/analyze_inspiration.py
          python scripts/build_pages.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true

          for path in data/clusters data/daily output docs; do
            if [ -d "$path" ]; then
              git add "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update inspiration analysis"
            git push
          fi
